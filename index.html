<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recall – study tracker</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#162033;--mute:#5b6678;--line:#d9e0ea;--acc:#0f766e;--acc-ink:#fff;--warn:#b45309;--bad:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--card:#17212e;--ink:#e8edf4;--mute:#98a4b5;--line:#283547;--acc:#4fd1c0;--acc-ink:#07201d;--warn:#f0b35a;--bad:#ff8b7e}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.2 "Iowan Old Style",Palatino,Georgia,serif;margin:8px 0 2px}
h2{font-size:15px;margin:28px 0 10px;font-weight:600}
.sub{color:var(--mute);margin:0 0 18px}
form,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px}
.add{width:100%;margin-top:14px;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.due{border-left:4px solid var(--acc);margin-bottom:12px}
.due .t{font:600 22px/1.25 "Iowan Old Style",Palatino,Georgia,serif;margin:0 0 4px}
.meta{font-size:13px;color:var(--mute)}
.late{color:var(--warn)}
.prompt{margin:10px 0 12px}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ans .ok{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.ans .no{color:var(--bad)}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.up:last-child{border:0}
.up b{font-weight:600}
.x{border:0;background:none;color:var(--mute);padding:6px 10px;font-size:20px;line-height:1}
.empty{color:var(--mute);margin:0}
</style>
</head>
<body>
<main>
<h1>Recall</h1>
<p class="sub">Log what you studied. Come back when it’s due and test yourself from memory.</p>

<form id="f">
  <label for="topic">What did you study?</label>
  <input id="topic" required maxlength="120" placeholder="e.g. Chapter 4: cell respiration" autocomplete="off">
  <div class="row">
    <div><label for="studied">Studied on</label><input id="studied" type="date"></div>
    <div><label for="exam">Exam date (optional)</label><input id="exam" type="date"></div>
  </div>
  <button class="add" type="submit">Add to my reviews</button>
</form>

<h2 id="dueh">Due today</h2>
<div id="due"></div>

<h2>Coming up</h2>
<div class="card" id="up"></div>
<p class="meta" id="done"></p>
</main>

<script>
const $=id=>document.getElementById(id);
const KEY='recall.v1', GAPS=[1,4,10,21,60];
let items=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const today=()=>iso(new Date());
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Review days after studying. With an exam date, only gaps that fit before it, plus the day before.
function plan(studied,exam){
  let o=GAPS.slice();
  if(exam){const n=diff(exam,studied);
    if(n>=1){o=o.filter(x=>x<n);if(n>=2&&!o.includes(n-1))o.push(n-1);if(!o.length)o=[1]}}
  return [...new Set(o)].sort((a,b)=>a-b);
}

$('studied').value=today();
$('f').onsubmit=e=>{
  e.preventDefault();
  const t=$('topic').value.trim(); if(!t)return;
  const s=$('studied').value||today(), x=$('exam').value||'';
  const o=plan(s,x);
  items.push({id:Date.now().toString(36),topic:t,studied:s,exam:x,offs:o,step:0,due:add(s,o[0]),done:false});
  save();$('topic').value='';render();
};

function answer(id,r){
  const it=items.find(i=>i.id===id); if(!it)return; const t=today();
  if(r==='ok'){
    if(it.step>=it.offs.length-1)it.done=true;
    else{it.step++;it.due=add(t,Math.max(1,it.offs[it.step]-it.offs[it.step-1]))}
  }else if(r==='part'){it.due=add(t,2)}
  else{it.step=Math.max(0,it.step-1);it.due=add(t,1)}
  save();render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]'); if(!b)return;
  if(b.dataset.a==='del'){if(confirm('Delete this topic?')){items=items.filter(i=>i.id!==b.dataset.id);save();render()}}
  else answer(b.dataset.id,b.dataset.a);
});

function when(d){
  const n=diff(d,today());
  return n===1?'tomorrow':'in '+n+' days';
}

function render(){
  const t=today();
  const live=items.filter(i=>!i.done).sort((a,b)=>a.due<b.due?-1:1);
  const due=live.filter(i=>i.due<=t), up=live.filter(i=>i.due>t);
  $('dueh').textContent=due.length?'Due today ('+due.length+')':'Due today';
  $('due').innerHTML=due.length?due.map(i=>{
    const late=diff(t,i.due);
    return '<div class="card due"><p class="t">'+esc(i.topic)+'</p>'
    +'<div class="meta">Review '+(i.step+1)+' of '+i.offs.length+' · studied '+i.studied+(late>0?' · <span class="late">'+late+(late===1?' day':' days')+' late</span>':'')+'</div>'
    +'<p class="prompt">Close your notes. Write or say everything you remember about this, then check your notes and fill the gaps. How did it go?</p>'
    +'<div class="ans"><button class="ok" data-a="ok" data-id="'+i.id+'">Remembered</button>'
    +'<button data-a="part" data-id="'+i.id+'">Partly</button>'
    +'<button class="no" data-a="no" data-id="'+i.id+'">Forgot</button></div></div>';
  }).join(''):'<p class="empty">Nothing due right now. Add what you studied today and its first review will show up tomorrow.</p>';
  $('up').innerHTML=up.length?up.map(i=>
    '<div class="up"><div><b>'+esc(i.topic)+'</b><div class="meta">Review '+(i.step+1)+' of '+i.offs.length+' · '+when(i.due)+' ('+i.due+')'+(i.exam?' · exam '+i.exam:'')+'</div></div>'
    +'<button class="x" data-a="del" data-id="'+i.id+'" aria-label="Delete '+esc(i.topic)+'">×</button></div>'
  ).join(''):'<p class="empty">No upcoming reviews yet.</p>';
  const d=items.filter(i=>i.done).length;
  $('done').textContent=d?d+(d===1?' topic':' topics')+' fully reviewed.':'';
}
render();
</script>
</body>
</html>
